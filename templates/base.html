<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StreamLive{% endblock %} — 直播站</title>
    <script>
        // 防闪烁：在页面渲染前立即设置主题
        (function() {
            var t = localStorage.getItem('sl-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <i class="fas fa-broadcast-tower"></i> StreamLive
            </a>
            <div class="nav-links">
                <a href="/"><i class="fas fa-home"></i> 首页</a>
                {% if session.get('logged_in') %}
                <a href="/admin"><i class="fas fa-cog"></i> 管理</a>
                <a href="/logout"><i class="fas fa-sign-out-alt"></i> 退出</a>
                {% else %}
                <a href="/login"><i class="fas fa-sign-in-alt"></i> 登录</a>
                {% endif %}
                <a href="https://github.com/yyzq-cf/stream-live" target="_blank" class="nav-github" title="GitHub">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                </a>
                <button class="theme-toggle" onclick="toggleTheme()" title="切换明暗模式">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>StreamLive {{ APP_VERSION }} &mdash; 接收流并直播 &bull; Powered by Flask + nginx-rtmp + HLS.js</p>
    </footer>

    <script>
    function toggleTheme() {
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('sl-theme', next);
        updateThemeIcon(next);
    }
    function updateThemeIcon(t) {
        var icon = document.querySelector('.theme-toggle i');
        if (icon) icon.className = t === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
    }
    (function() {
        var t = document.documentElement.getAttribute('data-theme') || 'dark';
        updateThemeIcon(t);
    })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
