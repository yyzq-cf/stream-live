<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StreamLive{% endblock %} — 直播站</title>
    <script>
        // 防闪烁：在页面渲染前立即设置主题
        (function() {
            var t = localStorage.getItem('sl-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <i class="fas fa-broadcast-tower"></i> StreamLive
            </a>
            <div class="nav-links">
                <a href="/"><i class="fas fa-home"></i> 首页</a>
                {% if session.get('logged_in') %}
                <a href="/admin"><i class="fas fa-cog"></i> 管理</a>
                <a href="/logout"><i class="fas fa-sign-out-alt"></i> 退出</a>
                {% else %}
                <a href="/login"><i class="fas fa-sign-in-alt"></i> 登录</a>
                {% endif %}
                <button class="theme-toggle" onclick="toggleTheme()" title="切换明暗模式">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>StreamLive &mdash; 接收流并直播 &bull; Powered by Flask + nginx-rtmp + HLS.js</p>
    </footer>

    <script>
    function toggleTheme() {
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('sl-theme', next);
        updateThemeIcon(next);
    }
    function updateThemeIcon(t) {
        var icon = document.querySelector('.theme-toggle i');
        if (icon) icon.className = t === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
    }
    (function() {
        var t = document.documentElement.getAttribute('data-theme') || 'dark';
        updateThemeIcon(t);
    })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
